name: Build Windows VST3

# Upload this whole folder to a GitHub repo and this workflow builds your
# Windows .vst3 for free in the cloud — no Visual Studio needed on your PC.
# Result: Repo -> Actions -> latest run -> Artifacts -> ReverseReverb-Windows-VST3

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (downloads JUCE automatically)
        run: cmake -S VST3 -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        run: cmake --build build --config Release --target ReverseReverbOneClick_VST3

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: ReverseReverb-Windows-VST3
          path: build/**/VST3/**
